<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Wrap the raw angle error back to one circle</title><desc id="desc">Angles near opposite ends of the interval can still be close on the circle.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="720">Wrap the raw angle error back to one circle</text><g fill="none" stroke-width="2" opacity="0.82" stroke="#67b7ff"><circle cx="651" cy="42" r="23"/><path d="M651 42 L671 29"/><circle cx="671" cy="29" r="3" fill="#f0c95a" stroke="none"/></g><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">INPUT</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">delta = predicted -</text><text x="36" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">target</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">any real angle</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">CORE STEP</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">atan2(sin delta, cos</text><text x="270" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">delta)</text><text x="270" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">wrap across +/- pi</text></g><g><text x="504" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">RESULT</text><text x="504" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">shortest signed</text><text x="504" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">error</text><text x="504" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">inside [-pi, pi]</text></g><path d="M231 177 H254" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M254 172 L263 177 L254 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 177 H488" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M488 172 L497 177 L488 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>