<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Average precision is area under ranked precision-recall</title><desc id="desc">Ranking matters: the same matches in a different order can produce different AP.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="720">Average precision is area under ranked precision-recall</text><g fill="#67b7ff" opacity="0.82"><rect x="627" y="47" width="8" height="13"/><rect x="641" y="35" width="8" height="25"/><rect x="655" y="22" width="8" height="38"/><rect x="669" y="42" width="8" height="18"/></g><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">INPUT</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">ranked TP/FP matches</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">highest score first</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">CORE STEP</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">cumulative precision</text><text x="270" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">and recall</text><text x="270" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">update at each rank</text></g><g><text x="504" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">RESULT</text><text x="504" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">area under PR curve</text><text x="504" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">one AP scalar</text></g><path d="M231 177 H254" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M254 172 L263 177 L254 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 177 H488" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M488 172 L497 177 L488 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>