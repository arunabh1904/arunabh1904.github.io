<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to mix predictions from retrieved passages</title>
  <desc id="desc">RAG-Sequence scores a full answer under each retrieved passage, then mixes scores. RAG-Token mixes next-token probabilities at every step using the same passages.</desc>
  <rect width="760" height="232" rx="18" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#0f172a">
    <text x="24" y="32" font-weight="700">RAG-Sequence</text>
    <text x="24" y="140" font-weight="700">RAG-Token</text>
    <g stroke="#94a3b8" fill="white">
      <rect x="24" y="44" width="178" height="58" rx="8"/>
      <rect x="246" y="44" width="249" height="58" rx="8"/>
      <rect x="539" y="44" width="197" height="58" rx="8" fill="#dbeafe"/>
      <rect x="24" y="152" width="178" height="58" rx="8"/>
      <rect x="246" y="152" width="249" height="58" rx="8"/>
      <rect x="539" y="152" width="197" height="58" rx="8" fill="#dbeafe"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="113" y="79">Top-k passages</text>
      <text x="370" y="69">Score the whole answer</text><text x="370" y="89">under each passage</text>
      <text x="637" y="69">Mix complete</text><text x="637" y="89">answer scores</text>
      <text x="113" y="187">Top-k passages</text>
      <text x="370" y="177">Score the next token</text><text x="370" y="197">under each passage</text>
      <text x="637" y="177">Mix token scores</text><text x="637" y="197">and repeat</text>
    </g>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <path d="M209 73h29"/><path d="M502 73h29"/><path d="M209 181h29"/><path d="M502 181h29"/>
  </g>
</svg>
