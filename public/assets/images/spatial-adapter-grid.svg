<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Four neighboring cells concatenate then project into one reader token"><rect width="100%" height="100%" fill="#fcfbf7"/><style>text{font-family:Arial,sans-serif;fill:#172b35;font-size:20px}.small{font-size:16px}.line{fill:none;stroke:#263d47;stroke-width:2.3}.box{fill:#eff4f3;stroke:#263d47;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#263d47"/></marker></defs><text x="35" y="36">Local grid merge</text><text class="small" x="35" y="280">Proposed adapter · channel concatenation within each 2 × 2 neighborhood</text><rect x="40" y="80" width="60" height="60" rx="5" fill="#bddbd7" stroke="#263d47"/><text x="54" y="116">x1</text><rect x="104" y="80" width="60" height="60" rx="5" fill="#e4d3af" stroke="#263d47"/><text x="118" y="116">x2</text><rect x="40" y="144" width="60" height="60" rx="5" fill="#d1daf0" stroke="#263d47"/><text x="54" y="180">x3</text><rect x="104" y="144" width="60" height="60" rx="5" fill="#dfc8db" stroke="#263d47"/><text x="118" y="180">x4</text><text class="small" x="40" y="235">4 cells × 256</text><path class="line" d="M185 140 L260 140" marker-end="url(#arrow)"/><rect x="285" y="108" width="53" height="64" fill="#bddbd7" stroke="#263d47"/><text x="293" y="148">x1</text><rect x="340" y="108" width="53" height="64" fill="#e4d3af" stroke="#263d47"/><text x="348" y="148">x2</text><rect x="395" y="108" width="53" height="64" fill="#d1daf0" stroke="#263d47"/><text x="403" y="148">x3</text><rect x="450" y="108" width="53" height="64" fill="#dfc8db" stroke="#263d47"/><text x="458" y="148">x4</text><text class="small" x="292" y="205">1 vector × 1,024</text><path class="line" d="M520 140 L580 140" marker-end="url(#arrow)"/><rect class="box" x="600" y="101" width="130" height="78" rx="8"/><text x="626" y="145">MLP</text><path class="lin