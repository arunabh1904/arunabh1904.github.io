<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">The robot post-training loop</title>
  <desc id="desc">A pretrained policy is adapted to a task, deployed, mined for failures, given local supervision, optimized conservatively, evaluated for retention and safety, canary deployed, and repeated with new evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151f"/><stop offset="1" stop-color="#111d2b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#74dfbc"/></marker><style>text{font-family:Inter,Arial,sans-serif}.k{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#74dfbc}.n{font-size:16px;font-weight:700;fill:#f3f7fa}.s{font-size:12px;fill:#9fb4c2}.box{fill:#132531;stroke:#326052;stroke-width:1.3}.line{fill:none;stroke:#74dfbc;stroke-width:2.4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/><text x="34" y="35" class="k">ROBOT POLICY POST-TRAINING LOOP</text>
  <g><path class="line" d="M234 126H258"/><path class="line" d="M458 126H482"/><path class="line" d="M682 126H706"/><path class="line" d="M906 126H930"/><path class="line" d="M1033 174V226H906"/><path class="line" d="M706 276H682"/><path class="line" d="M482 276H458"/><path class="line" d="M258 276H234"/><path class="line" d="M130 226V198Q130 174 154 174H1033" opacity=".28"/>
    <rect class="box" x="34" y="78" width="200" height="96" rx="14"/><rect class="box" x="258" y="78" width="200" height="96" rx="14"/><rect class="box" x="482" y="78" width="200" height="96" rx="14"/><rect class="box" x="706" y="78" width="200" height="96" rx="14"/><rect class="box" x="930" y="78" width="206" height="96" rx="14"/><rect class="box" x="706" y="228" width="200" height="96" rx="14"/><rect class="box" x="482" y="228" width="200" height="96" rx="14"/><rect class="box" x="258" y="228" width="200" height="96" rx="14"/><rect class="box" x="34" y="228" width="200" height="96" rx="14"/></g>
  <g text-anchor="middle"><text x="134" y="115" class="n"><tspan x="134">Pretrained</tspan><tspan x="134" dy="21">policy</tspan></text><text x="358" y="115" class="n"><tspan x="358">Task-specific</tspan><tspan x="358" dy="21">fine-tuning</tspan></text><text x="582" y="115" class="n"><tspan x="582">Robot</tspan><tspan x="582" dy="21">rollouts</tspan></text><text x="806" y="115" class="n"><tspan x="806">Identify failed</tspan><tspan x="806" dy="21">states and actions</tspan></text><text x="1033" y="115" class="n"><tspan x="1033">Corrected actions</tspan><tspan x="1033" dy="21">and preferences</tspan></text><text x="806" y="265" class="n"><tspan x="806">Bounded</tspan><tspan x="806" dy="21">policy update</tspan></text><text x="582" y="255" class="n"><tspan x="582">Task, regression,</tspan><tspan x="582" dy="21">and safety tests</tspan></text><text x="358" y="265" class="n"><tspan x="358">Limited robot</tspan><tspan x="358" dy="21">deployment</tspan></text><text x="134" y="255" class="n"><tspan x="134">Add verified</tspan><tspan x="134" dy="21">failures to data</tspan></text></g>
  <text x="600" y="367" class="s" text-anchor="middle">Ship an update only after task success, regression, and safety checks pass on the robot.</text>
</svg>
