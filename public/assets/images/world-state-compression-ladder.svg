<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">World-state compression ladder</title>
  <desc id="desc">World state becomes progressively more compressed from a dense scene field, to sparse structured entities, to learned latent registers, to one pooled embedding. Compute falls while the information burden on the objective rises.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#09151f"/><stop offset="1" stop-color="#121c2a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9a4ff"/></marker><style>text{font-family:Inter,Arial,sans-serif}.k{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#b9a4ff}.n{font-size:20px;font-weight:700;fill:#f3f7fa}.s{font-size:13px;fill:#9fb5c4}.box{fill:#122331;stroke:#4b426f;stroke-width:1.3}.line{fill:none;stroke:#b9a4ff;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="240" rx="22" fill="url(#bg)"/><text x="34" y="34" class="k">THE COMPRESSION LADDER</text><text x="1166" y="34" class="s" text-anchor="end">less compute · harder preservation objective</text>
  <g><path class="line" d="M290 130H330"/><path class="line" d="M570 130H610"/><path class="line" d="M850 130H890"/><rect class="box" x="34" y="70" width="256" height="120" rx="15"/><rect class="box" x="334" y="70" width="236" height="120" rx="15"/><rect class="box" x="614" y="70" width="236" height="120" rx="15"/><rect class="box" x="894" y="70" width="272" height="120" rx="15"/></g>
  <g text-anchor="middle"><text x="162" y="114" class="n">Dense scene field</text><text x="162" y="143" class="s">every BEV cell or voxel</text><text x="452" y="104" class="n"><tspan x="452">Sparse structured</tspan><tspan x="452" dy="24">entities</tspan></text><text x="452" y="158" class="s">actors · lanes · map elements</text><text x="732" y="104" class="n"><tspan x="732">Learned latent</tspan><tspan x="732" dy="24">registers</tspan></text><text x="732" y="158" class="s">small adaptive token set</text><text x="1030" y="114" class="n">One pooled embedding</text><text x="1030" y="143" class="s">maximum compression</text></g>
</svg>
