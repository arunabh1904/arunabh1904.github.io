<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="190" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">Blog audio release pipeline</title>
  <desc id="desc">Five stages connect the source pull request, clean main revision, narration compiler, audio pull request, and live Pages verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="190" rx="18" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M204 95H234"/>
    <path d="M424 95H454"/>
    <path d="M666 95H696"/>
    <path d="M886 95H916"/>
  </g>
  <g filter="url(#shadow)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g>
      <rect x="24" y="42" width="180" height="106" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="114" y="82" font-size="19" font-weight="700" fill="#0f172a">Published post</text>
      <text x="114" y="111" font-size="15" fill="#334155">final prose and figures</text>
    </g>
    <g>
      <rect x="234" y="42" width="190" height="106" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
      <text x="329" y="82" font-size="19" font-weight="700" fill="#0f172a">Merged source</text>
      <text x="329" y="111" font-size="13" fill="#334155">commit SHA and text hash</text>
    </g>
    <g>
      <rect x="454" y="32" width="212" height="126" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="560" y="74" font-size="19" font-weight="700" fill="#0f172a">Audio generator</text>
      <text x="560" y="104" font-size="15" fill="#334155">fixed voice sample</text>
      <text x="560" y="128" font-size="15" fill="#334155">one stream per section</text>
    </g>
    <g>
      <rect x="696" y="42" width="190" height="106" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="791" y="82" font-size="19" font-weight="700" fill="#0f172a">Audio PR</text>
      <text x="791" y="111" font-size="15" fill="#334155">MP3 + manifest</text>
    </g>
    <g>
      <rect x="916" y="42" width="180" height="106" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="1006" y="82" font-size="19" font-weight="700" fill="#0f172a">Live verification</text>
      <text x="1006" y="106" font-size="13" fill="#334155">page and audio HTTP 200</text>
      <text x="1006" y="130" font-size="13" fill="#334155">SHA-256 + listening check</text>
    </g>
  </g>
</svg>
