<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Sensor fusion and a triggered Driving VLM feeding trajectory proposal and independent validation</title>
  <desc id="desc">The layout follows the Waymo source figure. Camera, LiDAR, and radar enter the upper sensor-fusion branch. Selected camera history, route context, and an uncertainty trigger enter the lower Driving VLM branch. Both branches feed a trajectory proposal model on the right. A scorer ranks candidate trajectories, while an independent validator checks geometry, dynamics, traffic rules, uncertainty limits, and fallback requirements before the vehicle controller receives a trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#111f2d"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102331"/><stop offset="1" stop-color="#0b1823"/></linearGradient>
    <marker id="cyan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#58d8ff"/></marker>
    <marker id="pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff6fae"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#78e0a5"/></marker>
    <marker id="violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b19aff"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .kicker{font-size:15px;font-weight:750;letter-spacing:2.2px;fill:#78e0a5}
      .title{font-size:42px;font-weight:760;fill:#f2f7fa}
      .subtitle{font-size:19px;font-weight:520;fill:#a8bbc7}
      .branch-title{font-size:18px;font-weight:760;letter-spacing:1.8px;fill:#f2f7fa}
      .node-title{font-size:23px;font-weight:720;fill:#f2f7fa}
      .copy{font-size:18px;font-weight:520;fill:#a8bbc7}
      .small{font-size:16px;font-weight:560;fill:#a8bbc7}
      .micro{font-size:15px;font-weight:760;letter-spacing:1px;fill:#f2f7fa}
      .panel{fill:url(#panel);stroke-width:1.5}
      .cyan{stroke:#58d8ff}.pink{stroke:#ff6fae}.violet{stroke:#b19aff}.green{stroke:#78e0a5}.red{stroke:#ff7a76}
      .chip{fill:#0b1823;stroke-width:1.2}
      .flow{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="860" rx="24" fill="url(#bg)"/>
  <text x="52" y="52" class="kicker">PROPOSED IMPLEMENTATION OF THE PUBLISHED ARCHITECTURE</text>
  <text x="52" y="102" class="title">Sensor fusion and Driving VLM inputs converge before trajectory validation</text>
  <text x="52" y="136" class="subtitle">The layout mirrors the source figure: sensor fusion above, Driving VLM below, shared trajectory proposal on the right.</text>

  <rect x="40" y="176" width="748" height="272" rx="22" class="panel cyan"/>
  <text x="66" y="211" class="branch-title" fill="#58d8ff">SENSOR FUSION ENCODER · UPDATED EVERY PLANNING CYCLE</text>
  <rect x="66" y="239" width="156" height="178" rx="16" class="chip cyan"/>
  <text x="86" y="273" class="node-title">Sensors</text>
  <circle cx="88" cy="307" r="5" fill="#58d8ff"/><text x="105" y="313" class="copy">Camera</text>
  <circle cx="88" cy="347" r="5" fill="#ffc15a"/><text x="105" y="353" class="copy">LiDAR</text>
  <circle cx="88" cy="387" r="5" fill="#ff6fae"/><text x="105" y="393" class="copy">Radar</text>
  <path d="M222 328H262" class="flow cyan" marker-end="url(#cyan-arrow)"/>
  <rect x="272" y="229" width="226" height="188" rx="16" class="chip green"/>
  <text x="294" y="267" class="node-title">Align and fuse</text>
  <text x="294" y="304" class="copy">Calibration and depth</text>
  <text x="294" y="333" class="copy">Time and ego motion</text>
  <text x="294" y="362" class="copy">Sensor health and age</text>
  <text x="294" y="393" class="micro" fill="#78e0a5">SHARED VEHICLE FRAME</text>
  <path d="M498 328H538" class="flow green" marker-end="url(#green-arrow)"/>
  <rect x="548" y="229" width="214" height="188" rx="16" class="chip violet"/>
  <text x="570" y="267" class="node-title">Driving state</text>
  <text x="570" y="302" class="micro" fill="#78e0a5">EXPLICIT</text>
  <text x="570" y="328" class="copy">tracks · occupancy</text>
  <text x="570" y="353" class="copy">map · uncertainty</text>
  <text x="570" y="383" class="micro" fill="#b19aff">LEARNED</text>
  <text x="570" y="407" class="copy">dense features · tokens</text>

  <rect x="40" y="482" width="748" height="284" rx="22" class="panel pink"/>
  <text x="66" y="517" class="branch-title" fill="#ff6fae">DRIVING VLM · RUNS FOR RARE OR UNCERTAIN SCENES</text>
  <rect x="66" y="547" width="210" height="174" rx="16" class="chip pink"/>
  <text x="88" y="583" class="node-title">Selected context</text>
  <text x="88" y="619" class="copy">camera history</text>
  <text x="88" y="648" class="copy">route context</text>
  <text x="88" y="677" class="copy">rare / uncertain scene</text>
  <text x="88" y="706" class="copy">selected state features</text>
  <path d="M276 634H316" class="flow pink" marker-end="url(#pink-arrow)"/>
  <rect x="326" y="547" width="190" height="174" rx="16" class="chip pink"/>
  <text x="348" y="583" class="node-title">Driving VLM</text>
  <text x="348" y="621" class="copy">Interpret unusual</text>
  <text x="348" y="650" class="copy">objects + signals</text>
  <text x="348" y="679" class="copy">and road events</text>
  <path d="M516 634H546" class="flow pink" marker-end="url(#pink-arrow)"/>
  <rect x="556" y="547" width="206" height="174" rx="16" class="chip pink"/>
  <text x="578" y="580" class="node-title">VLM output</text>
  <text x="578" y="611" class="copy">scene interpretation</text>
  <text x="578" y="640" class="copy">linked region or actor</text>
  <text x="578" y="669" class="copy">confidence + time</text>
  <text x="578" y="698" class="copy">expiration rule</text>

  <rect x="836" y="176" width="724" height="590" rx="22" class="panel violet"/>
  <text x="864" y="211" class="branch-title" fill="#b19aff">TRAJECTORY PROPOSAL + INDEPENDENT VALIDATION</text>
  <path d="M762 314H880" class="flow green" marker-end="url(#green-arrow)"/>
  <path d="M762 634C820 634 826 326 880 326" class="flow pink" marker-end="url(#pink-arrow)"/>
  <rect x="890" y="236" width="630" height="126" rx="17" class="chip violet"/>
  <text x="916" y="276" class="node-title">Trajectory proposal model</text>
  <text x="916" y="311" class="copy">Inputs: tracks, map, learned features, and VLM scene interpretation</text>
  <text x="916" y="340" class="copy">Output: predicted actor futures and candidate ego trajectories</text>
  <path d="M1205 362V398" class="flow violet" marker-end="url(#violet-arrow)"/>
  <rect x="918" y="408" width="574" height="76" rx="16" class="chip violet"/>
  <text x="944" y="442" class="node-title">Candidate trajectories</text>
  <text x="944" y="470" class="copy">several feasible paths for the ego vehicle</text>
  <path d="M1080 484V516" class="flow violet" marker-end="url(#violet-arrow)"/>
  <path d="M1340 484V516" class="flow" stroke="#ff7a76" marker-end="url(#pink-arrow)"/>
  <rect x="884" y="526" width="286" height="112" rx="16" class="chip violet"/>
  <text x="906" y="562" class="node-title">Trajectory scorer</text>
  <text x="906" y="594" class="copy">Ranks safety, progress,</text>
  <text x="906" y="620" class="copy">comfort, and compliance</text>
  <rect x="1226" y="526" width="306" height="112" rx="16" class="chip red"/>
  <text x="1248" y="562" class="node-title">Independent validator</text>
  <text x="1248" y="594" class="copy">Geometry, dynamics, and rules</text>
  <text x="1248" y="620" class="copy">Uncertainty limits and fallback</text>
  <path d="M762 365H808V501H1508V526" class="flow green" stroke-dasharray="8 7" marker-end="url(#green-arrow)"/>
  <text x="1160" y="495" class="micro" text-anchor="middle" fill="#78e0a5">EXPLICIT SENSOR STATE ALSO FEEDS THE VALIDATOR</text>
  <path d="M1027 638V668H1178" class="flow violet" marker-end="url(#violet-arrow)"/>
  <path d="M1379 638V668H1232" class="flow" stroke="#ff7a76" marker-end="url(#pink-arrow)"/>
  <rect x="1024" y="678" width="388" height="62" rx="16" class="chip green"/>
  <text x="1218" y="707" class="node-title" text-anchor="middle">Select a valid trajectory</text>
  <text x="1218" y="730" class="small" text-anchor="middle">highest-scoring trajectory that passes every check</text>
  <path d="M1218 740V796" class="flow green" marker-end="url(#green-arrow)"/>
  <rect x="1082" y="798" width="272" height="44" rx="22" class="chip green"/>
  <text x="1218" y="826" class="node-title" text-anchor="middle">Vehicle controller</text>

  <text x="52" y="826" class="subtitle">The VLM adds scene context but cannot overwrite sensor state. Only the independent validator can admit a trajectory.</text>
</svg>
