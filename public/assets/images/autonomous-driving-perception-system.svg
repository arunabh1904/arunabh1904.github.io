<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous-driving perception pipeline</title>
  <desc id="desc">Camera, LiDAR, and radar retain sensor-specific measurements through separate encoders. Calibration, camera-to-3D conversion, timing, and ego motion align those features in dense bird's-eye-view fields, sparse object queries, or compact learned latent tokens. Temporal state carries dense scene context, selected actors, or compressed world state into task-specific heads. LiDAR labels, teacher models, and future frames appear only in the training graph.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="0%" r="96%"><stop offset="0%" stop-color="#173248"/><stop offset="54%" stop-color="#081019"/><stop offset="100%" stop-color="#050a10"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#142737"/><stop offset="55%" stop-color="#0e1c28"/><stop offset="100%" stop-color="#09131d"/></linearGradient>
    <pattern id="micro" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8cb4c8" stroke-width=".6" opacity=".12"/></pattern>
    <pattern id="bev" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#78e0a5" stroke-width=".7" opacity=".32"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02070c" flood-opacity=".48"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow-camera" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#58d8ff"/></marker>
    <marker id="arrow-lidar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffc15a"/></marker>
    <marker id="arrow-radar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff6fae"/></marker>
    <marker id="arrow-metric" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#78e0a5"/></marker>
    <marker id="arrow-task" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b19aff"/></marker>
    <style>
      text{font-family:"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;fill:#f0f6f8}.title{font-size:38px;font-weight:680;letter-spacing:-.7px}.kicker{font-size:14px;font-weight:650;letter-spacing:2.2px;fill:#8fa6b5}.label{font-size:18px;font-weight:650}.small{font-size:14px;font-weight:520;fill:#8fa6b5}.micro{font-size:12px;font-weight:600;letter-spacing:.8px}.cam{stroke:#58d8ff}.lidar{stroke:#ffc15a}.radar{stroke:#ff6fae}.metric{stroke:#78e0a5}.task{stroke:#b19aff}.flow{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.train{fill:none;stroke:#ff7a76;stroke-width:2;stroke-dasharray:8 8;stroke-linecap:round;stroke-linejoin:round}.node{fill:url(#panel);stroke-width:1.2}.chip{fill:#0c1622;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#micro)" opacity=".32"/>
  <circle cx="1480" cy="70" r="260" fill="#58d8ff" opacity=".025"/><circle cx="80" cy="690" r="250" fill="#78e0a5" opacity=".02"/>

  <text x="58" y="64" class="kicker" fill="#78e0a5">PERCEPTION PIPELINE</text>
  <text x="58" y="111" class="title">Autonomous-driving perception pipeline</text>
  <text x="58" y="143" class="small">Separate encoders retain each sensor's measurements; alignment converts them into shared 3D representations.</text>
  <line x1="58" y1="168" x2="1542" y2="168" stroke="#26394a" stroke-width="1.2"/>

  <text x="168" y="205" class="kicker" text-anchor="middle">SENSORS</text>
  <text x="431" y="205" class="kicker" text-anchor="middle">SENSOR ENCODERS</text>
  <text x="795" y="205" class="kicker" text-anchor="middle">COORDINATE ALIGNMENT</text>
  <text x="1139" y="205" class="kicker" text-anchor="middle">TEMPORAL STATE</text>
  <text x="1434" y="205" class="kicker" text-anchor="middle">TASK HEADS</text>

  <!-- Sensor rows -->
  <g filter="url(#shadow)">
    <rect x="58" y="234" width="220" height="112" rx="18" class="node cam"/><rect x="58" y="370" width="220" height="112" rx="18" class="node lidar"/><rect x="58" y="506" width="220" height="112" rx="18" class="node radar"/>
  </g>
  <g transform="translate(83 263)" fill="none" stroke="#58d8ff" stroke-width="2.5"><rect x="0" y="7" width="42" height="30" rx="5"/><circle cx="21" cy="22" r="8"/><path d="M42 14 56 9v26l-14-5"/></g>
  <text x="154" y="280" class="label">Camera</text><text x="154" y="305" class="small">appearance · rays</text><text x="154" y="327" class="small">calibration · time</text>
  <g transform="translate(84 397)" fill="none" stroke="#ffc15a" stroke-width="2.5"><rect x="12" y="31" width="44" height="20" rx="4"/><path d="M34 31V13M22 23Q34 10 46 23M12 16Q34-4 56 16"/><circle cx="34" cy="41" r="3" fill="#ffc15a"/></g>
  <text x="154" y="416" class="label">LiDAR</text><text x="154" y="441" class="small">range · height</text><text x="154" y="463" class="small">intensity · time</text>
  <g transform="translate(88 534)" fill="none" stroke="#ff6fae" stroke-width="2.5"><circle cx="12" cy="23" r="6"/><path d="M23 13Q35 23 23 33M33 6Q53 23 33 40M43 0Q69 23 43 46"/></g>
  <text x="154" y="552" class="label">Radar</text><text x="154" y="577" class="small">range · velocity</text><text x="154" y="599" class="small">RCS · uncertainty</text>

  <!-- Sensor-specific encoders -->
  <g filter="url(#shadow)">
    <rect x="310" y="234" width="242" height="112" rx="18" class="node cam"/><rect x="310" y="370" width="242" height="112" rx="18" class="node lidar"/><rect x="310" y="506" width="242" height="112" rx="18" class="node radar"/>
  </g>
  <!-- Miniatures occupy reserved upper-right lanes; labels never run underneath them. -->
  <text x="334" y="268" class="micro" fill="#58d8ff">CAMERA BACKBONE</text><text x="334" y="296" class="label">Multiscale image</text><text x="334" y="317" class="label">features</text><text x="334" y="337" class="small">calibrated views</text>
  <g transform="translate(530 246) scale(.46)" fill="none" stroke="#58d8ff"><rect width="42" height="54" rx="5" opacity=".45"/><rect x="-10" y="8" width="42" height="54" rx="5" opacity=".7"/><rect x="-20" y="16" width="42" height="54" rx="5"/></g>
  <text x="334" y="404" class="micro" fill="#ffc15a">LIDAR BACKBONE</text><text x="334" y="430" class="label">Sparse occupied</text><text x="334" y="451" class="label">voxels</text><text x="334" y="473" class="small">densify early, late, or never</text>
  <g transform="translate(502 382) scale(.62)" fill="#ffc15a"><rect width="13" height="13" opacity=".9"/><rect x="23" y="8" width="13" height="13" opacity=".6"/><rect x="46" y="0" width="13" height="13"/><rect x="8" y="31" width="13" height="13" opacity=".5"/><rect x="38" y="38" width="13" height="13" opacity=".8"/></g>
  <text x="334" y="540" class="micro" fill="#ff6fae">RADAR BACKBONE</text><text x="334" y="572" class="label">Returns + Doppler</text><text x="334" y="597" class="small">before fusion</text>
  <g transform="translate(513 519) scale(.50)" fill="none" stroke="#ff6fae" stroke-width="2"><circle cx="16" cy="35" r="5" fill="#ff6fae"/><path d="M16 35 54 13M16 35 62 35M16 35 52 55"/><circle cx="54" cy="13" r="4"/><circle cx="62" cy="35" r="4"/><circle cx="52" cy="55" r="4"/></g>

  <!-- Colored sensor flows into encoders and geometry -->
  <path d="M278 290H310" class="flow cam" marker-end="url(#arrow-camera)"/><path d="M278 426H310" class="flow lidar" marker-end="url(#arrow-lidar)"/><path d="M278 562H310" class="flow radar" marker-end="url(#arrow-radar)"/>
  <path d="M552 290H604V340H630" class="flow cam" marker-end="url(#arrow-camera)"/><path d="M552 426H630" class="flow lidar" marker-end="url(#arrow-lidar)"/><path d="M552 562H604V544H630" class="flow radar" marker-end="url(#arrow-radar)"/>

  <!-- Metric representation -->
  <g filter="url(#shadow)"><rect x="630" y="234" width="330" height="384" rx="20" class="node metric"/></g>
  <text x="656" y="270" class="micro" fill="#78e0a5">SHARED 3D INTERFACE</text>
  <rect x="656" y="292" width="278" height="92" rx="15" class="chip metric"/>
  <rect x="678" y="310" width="84" height="58" rx="8" fill="url(#bev)" stroke="#78e0a5" stroke-width="1.2"/><path d="M690 357Q718 331 752 319" fill="none" stroke="#58d8ff" stroke-width="4" opacity=".35"/><rect x="720" y="334" width="24" height="15" rx="4" fill="#ffc15a" opacity=".72"/>
  <text x="790" y="328" class="label">Dense BEV</text><text x="790" y="350" class="small">roads · free space</text><text x="790" y="370" class="small">occupancy · maps</text>
  <rect x="656" y="396" width="278" height="92" rx="15" class="chip metric"/>
  <g transform="translate(684 417)" fill="none" stroke="#78e0a5" stroke-width="2"><path d="M6 8 46 20 18 54 66 60"/><circle cx="6" cy="8" r="6" fill="#0c1622"/><circle cx="46" cy="20" r="6" fill="#0c1622"/><circle cx="18" cy="54" r="6" fill="#0c1622"/><circle cx="66" cy="60" r="6" fill="#0c1622"/></g>
  <text x="790" y="432" class="label">Sparse queries</text><text x="790" y="454" class="small">actors · tracks</text><text x="790" y="474" class="small">map elements</text>
  <rect x="656" y="500" width="278" height="92" rx="15" class="chip metric"/>
  <g transform="translate(684 526)" fill="none" stroke="#b19aff" stroke-width="2"><circle cx="14" cy="20" r="9" fill="#0c1622"/><circle cx="52" cy="8" r="9" fill="#0c1622"/><circle cx="70" cy="42" r="9" fill="#0c1622"/><path d="M22 17 43 11M54 16 65 34M22 26 62 40"/></g>
  <text x="790" y="536" class="label">Learned tokens</text><text x="790" y="558" class="small">compact scene state</text><text x="790" y="578" class="small">no explicit spatial grid</text>
  <text x="795" y="608" class="small" text-anchor="middle">representation choice sets spatial detail and memory cost</text>

  <!-- Temporal state -->
  <g filter="url(#shadow)"><rect x="1018" y="234" width="242" height="384" rx="20" class="node task"/></g>
  <text x="1044" y="270" class="micro" fill="#b19aff">FRAME-TO-FRAME STATE</text>
  <rect x="1044" y="292" width="190" height="92" rx="15" class="chip task"/><text x="1066" y="320" class="label">Dense recurrence</text><text x="1066" y="344" class="small">warp or attend</text><text x="1066" y="364" class="small">BEV state</text>
  <g transform="translate(1183 351)"><rect x="0" y="0" width="39" height="24" rx="5" fill="url(#bev)" stroke="#58d8ff"/><rect x="-15" y="-9" width="39" height="24" rx="5" fill="url(#bev)" stroke="#58d8ff" opacity=".55"/></g>
  <rect x="1044" y="396" width="190" height="92" rx="15" class="chip task"/><text x="1066" y="424" class="label">Sparse recurrence</text><text x="1066" y="448" class="small">keep queries</text><text x="1066" y="468" class="small">birth, age</text>
  <g transform="translate(1165 472)" fill="none" stroke="#b19aff" stroke-width="2"><circle cx="0" cy="0" r="5"/><circle cx="26" cy="-10" r="5"/><circle cx="48" cy="6" r="5"/><path d="M5-2 21-8M31-8 43 3"/></g>
  <rect x="1044" y="500" width="190" height="92" rx="15" class="chip task"/><text x="1066" y="528" class="label">Latent recurrence</text><text x="1066" y="552" class="small">compress, carry</text><text x="1066" y="572" class="small">refresh state</text>
  <g transform="translate(1165 575)" fill="none" stroke="#78e0a5" stroke-width="2"><circle cx="0" cy="0" r="5"/><circle cx="25" cy="-8" r="5"/><circle cx="48" cy="4" r="5"/><path d="M5-2 20-7M30-7 43 2"/></g>
  <path d="M960 338H990V338H1018" class="flow metric" marker-end="url(#arrow-metric)"/><path d="M960 442H990V442H1018" class="flow metric" marker-end="url(#arrow-metric)"/><path d="M960 546H990V546H1018" class="flow metric" marker-end="url(#arrow-metric)"/>

  <!-- Task heads -->
  <g filter="url(#shadow)"><rect x="1325" y="234" width="217" height="384" rx="20" class="node task"/></g>
  <text x="1350" y="270" class="micro" fill="#b19aff">SPECIALIZED OUTPUTS</text>
  <g>
    <rect x="1350" y="298" width="166" height="52" rx="14" class="chip cam"/><circle cx="1376" cy="324" r="7" fill="#58d8ff"/><text x="1395" y="331" class="label">Detection</text>
    <rect x="1350" y="366" width="166" height="52" rx="14" class="chip lidar"/><circle cx="1376" cy="392" r="7" fill="#ffc15a"/><text x="1395" y="399" class="label">Occupancy</text>
    <rect x="1350" y="434" width="166" height="52" rx="14" class="chip metric"/><circle cx="1376" cy="460" r="7" fill="#78e0a5"/><text x="1395" y="467" class="label">Lanes · map</text>
    <rect x="1350" y="502" width="166" height="52" rx="14" class="chip radar"/><circle cx="1376" cy="528" r="7" fill="#ff6fae"/><text x="1395" y="535" class="label">Velocity</text>
    <rect x="1350" y="570" width="166" height="52" rx="14" class="chip task"/><circle cx="1376" cy="596" r="7" fill="#b19aff"/><text x="1395" y="603" class="label">Planning</text>
  </g>
  <path d="M1260 338H1290V324H1325" class="flow task" marker-end="url(#arrow-task)"/><path d="M1260 442H1290V460H1325" class="flow task" marker-end="url(#arrow-task)"/><path d="M1260 546H1290V596H1325" class="flow task" marker-end="url(#arrow-task)"/>

  <!-- Training-only graph -->
  <line x1="58" y1="674" x2="1542" y2="674" stroke="#26394a" stroke-width="1.2"/>
  <text x="58" y="716" class="kicker" fill="#ff7a76">TRAINING-ONLY GRAPH</text>
  <rect x="250" y="692" width="184" height="52" rx="26" class="chip lidar"/><text x="342" y="724" class="small" text-anchor="middle" fill="#ffc15a">LiDAR depth labels</text>
  <rect x="458" y="692" width="184" height="52" rx="26" class="chip task"/><text x="550" y="724" class="small" text-anchor="middle" fill="#b19aff">teacher features</text>
  <rect x="666" y="692" width="184" height="52" rx="26" class="chip metric"/><text x="758" y="724" class="small" text-anchor="middle" fill="#78e0a5">future frames</text>
  <path d="M342 692V650H604V350H630" class="train" marker-end="url(#arrow-radar)"/><path d="M550 692V650H795V618" class="train" marker-end="url(#arrow-radar)"/><path d="M758 692V650H1139V618" class="train" marker-end="url(#arrow-radar)"/>
  <text x="1538" y="724" class="small" text-anchor="end">LiDAR labels, teacher features, and future frames are used only during training</text>
</svg>
