<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Absolute error, then one mean</title><desc id="desc">L1 loss keeps each absolute error visible until the final mean.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="720">Absolute error, then one mean</text><path d="M620 56 C636 56 638 26 652 26 C666 26 669 56 684 56" fill="none" stroke="#67b7ff" stroke-width="2.5" opacity="0.82"/><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">INPUT</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">prediction - target</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">same shape</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">CORE STEP</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">take |error|</text><text x="270" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">elementwise</text></g><g><text x="504" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">RESULT</text><text x="504" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">mean absolute error</text><text x="504" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">one scalar</text></g><path d="M231 177 H254" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M254 172 L263 177 L254 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 177 H488" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M488 172 L497 177 L488 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>