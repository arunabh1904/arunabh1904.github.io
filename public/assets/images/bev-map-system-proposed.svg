<text x="70" y="202">Cameras · optional LiDAR / radar</text><text x="70" y="232">Calibration · timestamps · ego pose</text>
<text x="544" y="202">Noisy SD road graph</text><text x="544" y="232">Optional prior vectors / point cloud</text>
<text x="70" y="377">Lift / retrieve image features</text><text x="70" y="409">Warp recent spatial + vector memory</text><text x="70" y="441">Keep visibility and pose uncertainty</text>
<text x="544" y="377">Vector tokens + raster features</text><text x="544" y="409">Version · age · coverage · uncertainty</text><text x="544" y="441">Missing prior is an explicit condition</text>
<text x="70" y="605">Attention / gated fusion · retain independent discovery queries</text>
