<g font-size="19" fill="#52616b">
<text x="48" y="1489">MapTRv2 / LaneSegNet: structured geometry · TopoNet / TopoLogic: relations</text>
<text x="48" y="1521">SMERF / SEPT / Score: map conditioning · MapTracker: temporal identity</text>
<text x="48" y="1553">RTMap: change-aware association · TbV: real-change and visibility evaluation</text>
<text x="48" y="1599">Update policy, provenance, and the expanded output contract are proposed here.</text>
