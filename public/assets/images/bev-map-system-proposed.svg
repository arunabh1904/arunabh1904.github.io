<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1640" viewBox="0 0 1000 1640" role="img" aria-labelledby="title desc">
<title id="title">Proposed mapping system: observations, priors, topology, and verified updates</title>
<desc id="desc">Current sensors and recent memory form observation features. An aligned SD map and optional historical map supply separate priors. Structured decoders produce road elements and relations. The current graph serves planning, while visibility and alignment checks govern permanent updates to versioned storage.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.4"/></marker></defs>
