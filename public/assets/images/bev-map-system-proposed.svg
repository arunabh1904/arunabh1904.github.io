<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">Build the local map; verify permanent edits</title>
  <desc id="desc">Proposed implementation. Current sensors and recent memory provide observation BEV. An aligned, optional SD or historical map supplies a prior. Together they condition queries that decode road geometry and directed connections, while allowing unmapped elements to be discovered. The current local graph goes to planning with uncertainty and temporary restrictions. A separate verifier compares sensor evidence with the retained source map, checks visibility and alignment, and accumulates evidence across visits. Only confirmed edits enter versioned persistent storage; uncertain changes are deferred.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#26343b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="1000" rx="16" fill="#fcfbf8"/>
  <g font-family="Arial, sans-serif" fill="#17212b">
    <text x="32" y="43" font-size="22" fill="#52616b">PROPOSED IMPLEMENTATION</text>
    <text x="32" y="87" font-size="32" font-weight="700">Build the local map. Verify lasting edits.</text>

    <!-- Two inputs, one merge, then two distinct uses of the local graph. -->
    <g stroke="#26343b" stroke-width="2" fill="#fff">
      <rect x="32" y="121" width="310" height="150" rx="14"/>
      <rect x="378" y="121" width="310" height="150" rx="14"/>
      <rect x="32" y="326" width="656" height="226" rx="14"/>
      <rect x="32" y="625" width="310" height="170" rx="14" fill="#edf5f3"/>
      <rect x="378" y="625" width="310" height="200" rx="14" fill="#fbf0df"/>
      <rect x="378" y="883" width="310" height="88" rx="14"/>
    </g>
    <g fill="none" stroke="#26343b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M187 271v26h173v29"/>
      <path d="M533 271v26H360" marker-end="none"/>
      <path d="M360 552v36H187v37"/>
      <path d="M360 588h173v37"/>
      <path d="M533 825v58"/>
    </g>
    <circle cx="360" cy="297" r="4" fill="#26343b"/>
    <circle cx="360" cy="588" r="4" fill="#26343b"/>

    <g font-size="29" font-weight="700">
      <text x="52" y="160">Sensor evidence</text>
      <text x="398" y="160">Map prior</text>
    </g>
    <g font-size="25" fill="#3f5058">
      <text x="52" y="200">Current BEV</text>
      <text x="52" y="238">+ recent memory</text>
      <text x="398" y="200">SD / historical map</text>
      <text x="398" y="238">Aligned · optional</text>
    </g>

    <text x="56" y="370" font-size="29" font-weight="700">Decode the current road graph</text>
    <!-- A lane fork makes the decoded object concrete without adding another box. -->
    <g fill="none" stroke="#247064" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 506v-47q0-22 25-36l28-16"/>
      <path d="M84 459q0-22-20-35l-12-8"/>
      <path d="m126 407 11 0-5 10M52 427v-11l11 2"/>
    </g>
    <g fill="#fcfbf8" stroke="#247064" stroke-width="3">
      <circle cx="84" cy="506" r="5"/>
      <circle cx="84" cy="459" r="5"/>
    </g>
    <g font-size="25" fill="#3f5058">
      <text x="165" y="417">Road geometry + directed connections</text>
      <text x="165" y="455">Discover unmapped elements</text>
      <text x="165" y="493">Keep source + uncertainty</text>
    </g>

    <text x="52" y="666" font-size="29" font-weight="700">Plan now</text>
    <g font-size="25" fill="#3f5058">
      <text x="52" y="706">Use the local graph</text>
      <text x="52" y="744">Keep uncertainty +</text>
      <text x="52" y="776">temporary restrictions</text>
    </g>

    <text x="398" y="666" font-size="29" font-weight="700">Verify changes</text>
    <g font-size="25" fill="#3f5058">
      <text x="398" y="706">Compare sensors + prior</text>
      <text x="398" y="744">Visible? Well aligned?</text>
      <text x="398" y="782">Evidence across visits?</text>
    </g>
    <text x="549" y="859" font-size="21" font-weight="700" fill="#77511e">Confirmed only</text>
    <text x="533" y="919" text-anchor="middle" font-size="27" font-weight="700">Versioned map</text>
    <text x="533" y="952" text-anchor="middle" font-size="23" fill="#3f5058">Evidence + rollback</text>
    <text x="52" y="913" font-size="25" fill="#77511e">Uncertain change?</text>
    <text x="52" y="948" font-size="25" fill="#77511e">Defer the map edit.</text>
  </g>
</svg>
