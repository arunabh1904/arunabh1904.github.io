<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">BEVFusion camera and LiDAR data paths</title>
  <desc id="desc">Camera images pass through a camera encoder into camera BEV. LiDAR points pass through a point or voxel encoder into LiDAR BEV. The two aligned BEV representations meet in fusion before task heads.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151f"/><stop offset="1" stop-color="#111c2a"/></linearGradient><marker id="cA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60d8ff"/></marker><marker id="lA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffc96b"/></marker><marker id="fA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#76e1bd"/></marker><style>text{font-family:Inter,Arial,sans-serif}.k{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#76e1bd}.n{font-size:18px;font-weight:700;fill:#f3f7fa}.s{font-size:13px;fill:#9eb4c3}.box{fill:#102431;stroke-width:1.4}.cam{stroke:#60d8ff}.lidar{stroke:#ffc96b}.mix{stroke:#76e1bd}.ca{stroke:#60d8ff;marker-end:url(#cA)}.la{stroke:#ffc96b;marker-end:url(#lA)}.fa{stroke:#76e1bd;marker-end:url(#fA)}.line{fill:none;stroke-width:2.5}</style></defs>
  <rect width="1200" height="350" rx="22" fill="url(#bg)"/><text x="34" y="35" class="k">BEVFUSION · ALIGN BEFORE INTERACTION</text>
  <g><rect class="box cam" x="34" y="73" width="176" height="88" rx="14"/><rect class="box cam" x="262" y="73" width="190" height="88" rx="14"/><rect class="box cam" x="504" y="73" width="176" height="88" rx="14"/><rect class="box lidar" x="34" y="207" width="176" height="88" rx="14"/><rect class="box lidar" x="262" y="207" width="190" height="88" rx="14"/><rect class="box lidar" x="504" y="207" width="176" height="88" rx="14"/><rect class="box mix" x="766" y="140" width="176" height="88" rx="14"/><rect class="box mix" x="1000" y="140" width="166" height="88" rx="14"/>
    <path class="line ca" d="M210 117H254"/><path class="line ca" d="M452 117H496"/><path class="line ca" d="M680 117H718Q742 117 742 141V170Q742 184 758 184"/><path class="line la" d="M210 251H254"/><path class="line la" d="M452 251H496"/><path class="line la" d="M680 251H718Q742 251 742 227V198Q742 184 758 184"/><path class="line fa" d="M942 184H992"/></g>
  <g text-anchor="middle"><text x="122" y="111" class="n">Camera images</text><text x="122" y="136" class="s">dense appearance</text><text x="357" y="111" class="n">Camera encoder</text><text x="357" y="136" class="s">preserve image evidence</text><text x="592" y="111" class="n">Camera BEV</text><text x="592" y="136" class="s">metric support</text><text x="122" y="245" class="n">LiDAR points</text><text x="122" y="270" class="s">range + height</text><text x="357" y="235" class="n"><tspan x="357">Point / voxel</tspan><tspan x="357" dy="23">encoder</tspan></text><text x="357" y="282" class="s">preserve sparse geometry</text><text x="592" y="245" class="n">LiDAR BEV</text><text x="592" y="270" class="s">metric support</text><text x="854" y="178" class="n">Fusion</text><text x="854" y="203" class="s">aligned interaction</text><text x="1083" y="178" class="n">Task heads</text><text x="1083" y="203" class="s">detection · map · occupancy</text></g>
