<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Lift, Splat, Shoot camera-to-BEV construction</title>
  <desc id="desc">An image pixel determines a camera ray. A predicted depth distribution places copies of its feature in a 3D cloud, which is pooled into a bird's-eye-view grid.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1520"/><stop offset="1" stop-color="#121d2c"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#62d7ff"/></marker><style>text{font-family:Inter,Arial,sans-serif}.k{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#62d7ff}.n{font-size:20px;font-weight:700;fill:#f2f7fa}.s{font-size:13px;fill:#9fb4c2}.c{fill:#102536;stroke:#295369;stroke-width:1.3}.a{stroke:#62d7ff;stroke-width:2.4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="220" rx="22" fill="url(#bg)"/><text x="34" y="34" class="k">PUSH IMAGE EVIDENCE INTO 3D</text>
  <g><path class="a" d="M214 126H246"/><path class="a" d="M438 126H470"/><path class="a" d="M662 126H694"/><path class="a" d="M886 126H918"/>
    <rect class="c" x="30" y="64" width="184" height="124" rx="15"/><rect class="c" x="254" y="64" width="184" height="124" rx="15"/><rect class="c" x="478" y="64" width="184" height="124" rx="15"/><rect class="c" x="702" y="64" width="184" height="124" rx="15"/><rect class="c" x="926" y="64" width="244" height="124" rx="15"/></g>
  <g text-anchor="middle"><text x="122" y="109" class="n">Image pixel</text><text x="122" y="138" class="s">appearance feature</text><text x="346" y="109" class="n">Camera ray</text><text x="346" y="138" class="s">direction, not distance</text><text x="570" y="99" class="n"><tspan x="570">Depth</tspan><tspan x="570" dy="24">distribution</tspan></text><text x="570" y="151" class="s">candidate metric support</text><text x="794" y="99" class="n"><tspan x="794">3D feature</tspan><tspan x="794" dy="24">cloud</tspan></text><text x="794" y="151" class="s">feature copies along the ray</text><text x="1048" y="109" class="n">BEV grid</text><text x="1048" y="138" class="s">pool into vehicle coordinates</text></g>
</svg>
