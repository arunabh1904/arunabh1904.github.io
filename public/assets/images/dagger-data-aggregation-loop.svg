<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">DAgger data aggregation loop</title>
  <desc id="desc">The current policy visits states, an expert labels those visited states, the labels join an aggregate dataset, and the next policy is retrained from that dataset.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker>
    <style>
      .box{stroke:#334155;stroke-width:3;rx:22}.label{font:700 28px system-ui,sans-serif;fill:#0f172a}.sub{font:21px system-ui,sans-serif;fill:#334155}.step{font:700 18px system-ui,sans-serif;fill:#475569}.arrow{fill:none;stroke:#334155;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc" rx="28"/>
  <text x="600" y="48" text-anchor="middle" class="label">DAgger follows the learner into its own errors</text>
  <rect class="box" x="55" y="115" width="240" height="145" fill="#dbeafe"/>
  <text x="175" y="165" text-anchor="middle" class="step">1 · ROLLOUT</text>
  <text x="175" y="205" text-anchor="middle" class="label">Current policy</text>
  <text x="175" y="237" text-anchor="middle" class="sub">visits induced states</text>
  <rect class="box" x="355" y="115" width="240" height="145" fill="#fef3c7"/>
  <text x="475" y="165" text-anchor="middle" class="step">2 · QUERY</text>
  <text x="475" y="205" text-anchor="middle" class="label">Expert labels</text>
  <text x="475" y="237" text-anchor="middle" class="sub">the visited states</text>
  <rect class="box" x="655" y="115" width="240" height="145" fill="#dcfce7"/>
  <text x="775" y="165" text-anchor="middle" class="step">3 · AGGREGATE</text>
  <text x="775" y="205" text-anchor="middle" class="label">Dataset grows</text>
  <text x="775" y="237" text-anchor="middle" class="sub">old + new corrections</text>
  <rect class="box" x="955" y="115" width="190" height="145" fill="#ede9fe"/>
  <text x="1050" y="165" text-anchor="middle" class="step">4 · RETRAIN</text>
  <text x="1050" y="205" text-anchor="middle" class="label">Next policy</text>
  <text x="1050" y="237" text-anchor="middle" class="sub">fits all labels</text>
  <path class="arrow" d="M295 188H345"/><path class="arrow" d="M595 188H645"/><path class="arrow" d="M895 188H945"/>
  <path class="arrow" d="M1050 275V342H175V272"/>
  <text x="610" y="382" text-anchor="middle" class="sub">Repeat: the training distribution moves toward states the learner actually reaches</text>
</svg>
