<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300"><rect width="960" height="300" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#173042} .label{font-size:17px;text-anchor:middle} .box{fill:#eef3f8;stroke:#718497;stroke-width:2}</style><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#456"/></marker></defs><text x="30" y="35" font-size="24" font-weight="bold">Keep the repeated work in the smaller grid</text><g class="box"><rect x="25" y="130" width="135" height="65" rx="8"/><rect x="200" y="130" width="125" height="65" rx="8"/><rect x="370" y="115" width="220" height="95" rx="8" fill="#e2f4ed"/><rect x="635" y="130" width="125" height="65" rx="8"/><rect x="800" y="130" width="135" height="65" rx="8"/></g><g class="label"><text x="92" y="168">Training image</text><text x="262" y="168">Encoder</text><text x="480" y="155">Latent denoiser</text><text x="480" y="184">repeat × steps</text><text x="698" y="168">Decoder</text><text x="868" y="168">Output image</text><text x="480" y="77">Text / other condition</text></g><g stroke="#456" stroke-width="2" marker-end="url(#a)"><path d="M160 162H195"/><path d="M325 162H365"/><path d="M590 162H630"/><path d="M760 162H795"/><path d="M480 85V110"/></g><text x="30" y="252" font-size="17">Generation starts from latent noise. The encoder is used to create training latents.</text><text x="30" y="278" font-size="17">The decoder runs once at the end; repeated denoising uses the smaller spatial grid.</text></svg>