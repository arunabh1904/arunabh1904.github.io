<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop learning from a driving failure</title>
  <desc id="desc">A real or simulated failure is diagnosed by the Critic, converted into a targeted scenario and labels, used to improve a teacher and distill a student, checked by closed-loop regression, and reviewed for deployment before returning to new evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151f"/><stop offset="1" stop-color="#121d2b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff857f"/></marker><style>text{font-family:Inter,Arial,sans-serif}.k{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#ff857f}.n{font-size:17px;font-weight:700;fill:#f3f7fa}.s{font-size:12px;fill:#9fb4c2}.box{fill:#15232f;stroke:#6c3f44;stroke-width:1.3}.line{fill:none;stroke:#ff857f;stroke-width:2.4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><text x="34" y="35" class="k">FAILURE BECOMES A REGRESSION TEST</text>
  <g><path class="line" d="M242 122H274"/><path class="line" d="M482 122H514"/><path class="line" d="M722 122H754"/><path class="line" d="M962 122H994"/><path class="line" d="M1098 170V214H938"/><path class="line" d="M754 264H722"/><path class="line" d="M514 264H482"/><path class="line" d="M274 264H180Q112 264 112 194V170"/>
    <rect class="box" x="34" y="74" width="208" height="96" rx="14"/><rect class="box" x="274" y="74" width="208" height="96" rx="14"/><rect class="box" x="514" y="74" width="208" height="96" rx="14"/><rect class="box" x="754" y="74" width="208" height="96" rx="14"/><rect class="box" x="994" y="74" width="172" height="96" rx="14"/><rect class="box" x="754" y="216" width="208" height="96" rx="14"/><rect class="box" x="514" y="216" width="208" height="96" rx="14"/><rect class="box" x="274" y="216" width="208" height="96" rx="14"/></g>
  <g text-anchor="middle"><text x="138" y="111" class="n"><tspan x="138">Real or simulated</tspan><tspan x="138" dy="22">failure</tspan></text><text x="378" y="111" class="n"><tspan x="378">Critic</tspan><tspan x="378" dy="22">diagnosis</tspan></text><text x="618" y="111" class="n"><tspan x="618">Targeted scenario</tspan><tspan x="618" dy="22">+ labels</tspan></text><text x="858" y="111" class="n"><tspan x="858">Teacher</tspan><tspan x="858" dy="22">improvement</tspan></text><text x="1080" y="111" class="n"><tspan x="1080">Student</tspan><tspan x="1080" dy="22">distillation</tspan></text><text x="858" y="253" class="n"><tspan x="858">Closed-loop</tspan><tspan x="858" dy="22">regression</tspan></text><text x="618" y="253" class="n"><tspan x="618">Deployment</tspan><tspan x="618" dy="22">review</tspan></text><text x="378" y="253" class="n"><tspan x="378">New fleet</tspan><tspan x="378" dy="22">evidence</tspan></text></g>
</svg>
