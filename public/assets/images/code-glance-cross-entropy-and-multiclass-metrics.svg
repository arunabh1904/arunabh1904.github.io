<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Stable loss and confusion counts share valid labels</title><desc id="desc">Rows provide recall denominators; columns provide precision denominators.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="720">Stable loss and confusion counts share valid labels</text><g fill="none" stroke="#67b7ff" stroke-width="1.4" opacity="0.82"><rect x="632" y="22" width="12" height="12" fill="#f0c95a" fill-opacity="0.45"/><rect x="646" y="22" width="12" height="12"/><rect x="660" y="22" width="12" height="12"/><rect x="632" y="36" width="12" height="12"/><rect x="646" y="36" width="12" height="12" fill="#f0c95a" fill-opacity="0.45"/><rect x="660" y="36" width="12" height="12"/><rect x="632" y="50" width="12" height="12"/><rect x="646" y="50" width="12" height="12"/><rect x="660" y="50" width="12" height="12" fill="#f0c95a" fill-opacity="0.45"/></g><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">INPUT</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">logits + labels</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">filter ignore_index</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">CORE STEP</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, sys