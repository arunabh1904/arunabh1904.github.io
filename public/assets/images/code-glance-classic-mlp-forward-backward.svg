<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Forward computes activations; backward reuses them for gradients</title><desc id="desc">Every gradient has the same shape as the parameter it updates.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="720">Forward computes activations; backward reuses them for gradients</text><g fill="none" stroke-width="2" opacity="0.82" stroke="#67b7ff"><path d="M622 29 L651 42 L680 25 M622 55 L651 42 L680 58"/><circle cx="622" cy="29" r="4" fill="#67b7ff"/><circle cx="622" cy="55" r="4" fill="#67b7ff"/><circle cx="651" cy="42" r="5" fill="#f0c95a" stroke="none"/><circle cx="680" cy="25" r="4" fill="#77d99a"/><circle cx="680" cy="58" r="4" fill="#77d99a"/></g><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">FORWARD</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">batch x through two</text><text x="36" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">layers</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">predict and compute loss</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">BACKWARD</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">differentiate</text><text x="270" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">output, then hidden</text><text x="270" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">ReLU gates negative</text><text x="270" y="250" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">preactivations</text></g><g><text x="504" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">RESULT</text><text x="504" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">parameter gradients</text><text x="504" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">ready for an update</text></g><path d="M231 177 H254" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M254 172 L263 177 L254 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 177 H488" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M488 172 L497 177 L488 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>