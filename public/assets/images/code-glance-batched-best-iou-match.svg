<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Broadcast all box pairs, then reduce the ground-truth axis</title><desc id="desc">The M axis represents candidate ground truths and is the only axis reduced.</desc><rect width="720" height="300" rx="18" fill="#090d13"/><rect x="1" y="1" width="718" height="298" rx="17" fill="none" stroke="#253247" stroke-width="2"/><text x="36" y="52" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="720">Broadcast all box pairs, then reduce the ground-truth axis</text><g fill="none" stroke-width="2" opacity="0.82" stroke="#67b7ff"><rect x="627" y="24" width="34" height="26"/><rect x="644" y="34" width="34" height="26" stroke="#f28da7"/></g><path d="M252 96 V267 M486 96 V267" stroke="#253247" stroke-width="1"/><g><text x="36" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">INPUT</text><text x="36" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">pred (B,N,4) + GT</text><text x="36" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">(B,M,4)</text><text x="36" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">matched batch axis</text></g><g><text x="270" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">CORE STEP</text><text x="270" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">pairwise IoU (B,N,M)</text><text x="270" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">argmax over M</text></g><g><text x="504" y="112" fill="#f0c95a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1.3">RESULT</text><text x="504" y="145" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">best IoU + index</text><text x="504" y="168" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="680">(B,N)</text><text x="504" y="231" fill="#9aa9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="450">one match per prediction</text></g><path d="M231 177 H254" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M254 172 L263 177 L254 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 177 H488" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round"/><path d="M488 172 L497 177 L488 182" fill="none" stroke="#f0c95a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>